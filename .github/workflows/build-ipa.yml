name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 3105 Lite (3106 exploit backend, unsigned IPA)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project ThreeOneOSSix.xcodeproj

      - name: Build (no signing)
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          xcodebuild -project ThreeOneOSSix.xcodeproj \
            -scheme 3106 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/3106.app"
          test -d "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry 3105Lite-unsigned.ipa Payload
          shasum -a 256 3105Lite-unsigned.ipa | tee 3105Lite-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105Lite-unsigned-IPA
          path: |
            3105Lite-unsigned.ipa
            3105Lite-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
